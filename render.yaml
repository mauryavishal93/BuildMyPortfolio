services:
  - type: web
    name: buildmyportfolio
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: BILLING_ENABLED
        sync: false
      - key: BILLING_TERMS_PUBLISHED
        sync: false
      - key: BILLING_REFUNDS_PUBLISHED
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PRO_VOUCHERS_JSON
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_MONTHLY_ID
        sync: false
      - key: RAZORPAY_PLAN_YEARLY_ID
        sync: false